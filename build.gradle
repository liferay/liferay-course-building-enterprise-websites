// Check GETTING_STARTED.markdown for information regarding usage.

tasks.named('initBundle').configure {
    doLast {
        def dataDir = new File("${rootProject.projectDir}/bundles/data")
        if (dataDir.exists()) {
            dataDir.listFiles({ File f ->
                f.directory && f.name.startsWith("elasticsearch")
            } as FileFilter).each { esDir ->
                delete(esDir)
            }
        }
        def stateDir = new File("${rootProject.projectDir}/bundles/osgi/state")
        if (stateDir.exists()) {
            delete(stateDir)
        }
    }
}
